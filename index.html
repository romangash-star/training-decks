<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מצגות להכשרות</title>
  <link rel="stylesheet" href="_shared/theme.css">
  <style>
    body { margin: 0; font-family: var(--f-main); color: var(--c-ink); background: var(--c-bg); }
    header { background: var(--c-primary); color: var(--c-on-primary); padding: 56px 16px 48px; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); font-weight: 800; }
    header p { margin: 0; opacity: 0.85; font-size: 18px; }
    main { padding: 40px 0 64px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .deck {
      display: block; text-decoration: none; color: inherit;
      background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius);
      padding: 24px; box-shadow: var(--shadow); transition: transform .15s ease;
    }
    .deck:hover { transform: translateY(-3px); }
    .deck h2 { margin: 0 0 8px; color: var(--c-primary); font-size: 22px; }
    .deck p { margin: 0 0 16px; color: var(--c-ink-soft); font-size: 16px; line-height: 1.5; }
    .deck span { font-size: 14px; color: var(--c-muted); }
    .empty { color: var(--c-ink-soft); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>מצגות להכשרות</h1>
      <p>הרצאות וסדנאות לרשויות מקומיות</p>
    </div>
  </header>
  <main class="wrap">
    <div class="grid" id="list"><p class="empty">טוען…</p></div>
  </main>
  <script>
    // רשימת המצגות נמצאת ב-decks.json
    fetch("decks.json")
      .then(function (r) { return r.json(); })
      .then(function (decks) {
        var list = document.getElementById("list");
        list.replaceChildren();
        decks.forEach(function (d) {
          var a = document.createElement("a");
          a.className = "deck";
          a.href = d.folder + "/";
          var h = document.createElement("h2"); h.textContent = d.title;
          var p = document.createElement("p"); p.textContent = d.description || "";
          var s = document.createElement("span"); s.textContent = d.date || "";
          a.append(h, p, s);
          list.appendChild(a);
        });
      })
      .catch(function () {
        document.getElementById("list").innerHTML = '<p class="empty">לא הצלחתי לטעון את decks.json. פותחים את האתר דרך שרת, לא בלחיצה כפולה על הקובץ.</p>';
      });
  </script>
</body>
</html>
