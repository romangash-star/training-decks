<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מצגות להכשרות · RomanAI</title>
  <link rel="stylesheet" href="_shared/theme.css">
  <link rel="stylesheet" href="_shared/site.css">
</head>
<body>
  <header class="hero">
    <div class="bars" aria-hidden="true"><span style="height:70px"></span><span style="height:110px"></span><span style="height:160px"></span><span style="height:120px"></span><span style="height:90px"></span></div>
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="https://www.romanai.net/">Roman<b>AI</b></a>
      </div>
      <span class="eyebrow">הרצאות וסדנאות לרשויות מקומיות</span>
      <h1>מצגות להכשרות</h1>
      <p class="lead">כל המצגות במקום אחד: מציגים ישר מהדפדפן, עם דשבורדים וסרטונים חיים בתוך השקפים, וכל יום זמין גם להורדה כ-PDF.</p>
      <div class="stamp">
        <span class="chip"><span class="dot"></span>העלאה אחרונה: <b data-updated>…</b></span>
        <span class="chip"><span class="url" data-url></span><button class="copy" data-copy>העתקה</button></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-title">המצגות</h2>
    <div class="grid" id="list"><p class="empty">טוען…</p></div>
  </main>

  <footer>
    <div class="wrap">
      <span>RomanAI · רומן גרינשטיין</span>
      <span>גרסה <span data-commit></span></span>
    </div>
  </footer>

  <script src="_shared/site.js"></script>
  <script>
    // רשימת המצגות נמצאת ב-decks.json. שדות: folder, title, description, date, badge (לא חובה)
    function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
    fetch("decks.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (decks) {
        var list = document.getElementById("list");
        list.replaceChildren();
        decks.forEach(function (d) {
          var a = el("a", "card"); a.href = d.folder + "/";
          a.appendChild(el("div", "band"));
          var body = el("div", "body");
          var meta = el("div", "meta");
          if (d.badge) meta.appendChild(el("span", "badge" + (d.badgeNew ? " new" : ""), d.badge));
          if (d.date) meta.appendChild(el("span", "", d.date));
          body.appendChild(meta);
          body.appendChild(el("h2", "", d.title));
          if (d.description) body.appendChild(el("p", "", d.description));
          a.appendChild(body);
          var foot = el("div", "foot");
          var up = el("span", ""); up.append("עודכן: "); var t = el("b", ""); t.setAttribute("data-updated", d.folder); t.textContent = "…"; up.appendChild(t);
          foot.appendChild(up);
          foot.appendChild(el("span", "go", "פתיחה ←"));
          a.appendChild(foot);
          list.appendChild(a);
        });
        // מילוי זמני העדכון, גם אם site.js כבר סיים לטעון
        if (window.SiteInfo && SiteInfo.build) document.querySelectorAll("[data-updated]").forEach(function (n) {
          var k = n.getAttribute("data-updated"), v = k ? (SiteInfo.build.decks || {})[k] : SiteInfo.build.site;
          if (v) n.textContent = SiteInfo.fmt(v);
        });
      })
      .catch(function () {
        document.getElementById("list").innerHTML = '<p class="empty">לא הצלחתי לטעון את decks.json. פותחים את האתר דרך שרת, לא בלחיצה כפולה על הקובץ.</p>';
      });
  </script>
</body>
</html>
