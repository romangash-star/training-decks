<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת עסקים – כפר סבא</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d2329; --muted:#5f6873; --line:#e3e6e9; --accent:#1f6f5c; --accent-soft:#e6f2ee; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:'Heebo',system-ui,sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; background:#eef0ee; }

  /* Floating panel: legend + filters */
  .panel { position:absolute; top:10px; right:10px; max-height:calc(100% - 20px); width:clamp(180px, 21vw, 220px); z-index:1000;
    background:rgba(255,255,255,.97); border-radius:10px; box-shadow:0 3px 14px rgba(0,0,0,.18);
    display:flex; flex-direction:column; overflow:hidden; transition:transform .25s ease, opacity .25s; }
  .panel.hidden { transform:translateX(calc(100% + 20px)); opacity:0; pointer-events:none; }
  .ph { padding:9px 10px 7px; border-bottom:1px solid var(--line); }
  .ph h1 { margin:0; font-size:14px; font-weight:700; line-height:1.25; }
  .count { margin-top:0; font-size:11.5px; color:var(--muted); }
  .count b { color:var(--accent); font-size:12.5px; }
  .search { width:100%; margin-top:6px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:12px; }
  .search:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  .actions { display:flex; gap:5px; margin-top:5px; }
  .actions button { flex:1; padding:3px 0; border-radius:6px; font:inherit; font-size:12px; font-weight:500; cursor:pointer; border:1px solid var(--accent); }
  .btn-all { background:var(--accent); color:#fff; }
  .btn-clear { background:#fff; color:var(--accent); }
  .actions button:hover { filter:brightness(.95); }
  .pb { padding:2px 6px 8px; overflow-y:auto; flex:1; }
  .sec { font-size:11px; font-weight:700; color:var(--muted); margin:7px 4px 2px; letter-spacing:.02em; }
  .item { display:flex; align-items:center; gap:7px; padding:2.5px 4px; border-radius:5px; cursor:pointer; user-select:none; font-size:12px; line-height:1.2; }
  .item:hover { background:#f2f4f3; }
  .item input { position:absolute; opacity:0; pointer-events:none; }
  .sw { width:12px; height:12px; border-radius:50%; flex-shrink:0; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); position:relative; }
  .item .lbl { flex:1; }
  .item .n { font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:22px; text-align:left; }
  .item.off .sw { background:#fff !important; box-shadow:0 0 0 1.5px #b9c0c7; }
  .item.off .lbl, .item.off .n { color:#a3aab2; text-decoration:line-through; }

  .chips { display:flex; flex-wrap:wrap; gap:3px; padding:1px 4px; }
  .chip { font-size:10.5px; padding:1px 7px; border-radius:20px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); cursor:pointer; font-family:inherit; }
  .chip.off { background:#fff; color:#9aa2aa; border-color:#d3d8dc; text-decoration:line-through; }

  /* Corner controls */
  .ctl { position:absolute; z-index:1001; left:10px; display:flex; gap:6px; }
  .ctl.top { top:10px; } .ctl.bottom { bottom:24px; }
  .ctl button { background:#fff; border:0; border-radius:7px; box-shadow:0 2px 8px rgba(0,0,0,.2); padding:4px 10px; font:inherit; font-size:12px; font-weight:500; cursor:pointer; color:var(--ink); }
  .ctl button.on { background:var(--ink); color:#fff; }
  .leaflet-control-zoom { margin-left:10px !important; margin-top:44px !important; }

  .leaflet-popup-content { font-family:'Heebo',sans-serif; direction:rtl; text-align:right; margin:12px 14px; min-width:190px; }
  .pp-name { font-weight:700; font-size:15px; }
  .pp-what { color:var(--muted); font-size:13px; margin:2px 0 8px; }
  .pp-row { font-size:13px; margin:2px 0; } .pp-row span { color:var(--muted); }
  .pp-tag { display:inline-block; font-size:11px; padding:2px 9px; border-radius:10px; color:#fff; margin-top:6px; }


  /* View switch + raw table */
  .views { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1002; display:flex; background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.2); padding:3px; gap:2px; }

  .views button.on { background:var(--accent); color:#fff; }
  .tableview { position:absolute; inset:0; z-index:1001; background:#f7f8f7; display:none; flex-direction:column; padding:50px 12px 10px; }
  body.table .tableview { display:flex; }
  body.table .panel, body.table .ctl { display:none; }
  .tbar { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .tbar input { padding:5px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:12.5px; width:220px; max-width:50%; }
  .tbar .tc { font-size:12px; color:var(--muted); }
  .tbar a { margin-inline-start:auto; font-size:12px; font-weight:500; color:#fff; background:var(--accent); padding:5px 12px; border-radius:6px; text-decoration:none; }
  .twrap { flex:1; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th { position:sticky; top:0; background:#eef2f0; text-align:right; font-weight:700; padding:6px 8px; border-bottom:1px solid #d5dbd8; white-space:nowrap; cursor:pointer; user-select:none; }

  td { padding:4px 8px; border-bottom:1px solid #f0f2f1; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  tbody tr:nth-child(even) { background:#fafbfa; }
  tbody tr:hover { background:var(--accent-soft); cursor:pointer; }

  @media (max-width:560px) {
    .panel { top:auto; left:auto; right:8px; bottom:8px; width:190px; max-height:55%; }
    .panel.hidden { transform:translateY(calc(100% + 20px)); }
  }
</style>
</head>

<div id="map"></div>

<div class="ctl top">
  <button id="togglePanel" class="on">מקרא</button>
</div>
<div class="ctl bottom">

  <button data-base="sat">לוויין</button>

<section class="tableview">

    <a href="kfar-saba.csv" download="כפר סבא.csv">הורדת הקובץ (CSV)</a>

  <div class="twrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
</section>

<aside class="panel" id="panel">

    <div id="groups"></div>
    <div class="sec">סטטוס רישיון</div>
    <div class="chips" id="statuses"></div>
  </div>
</aside>

// Short, readable names for the legend
const NAMES = {
  'בריאות,רוקחות,קוסמטיקה': 'בריאות, רוקחות וקוסמטיקה',
  'תעשיה,מלאכה,כמיה,ומחצבים': 'תעשייה, מלאכה וכימיה',
  'עינוג ציבורי נופש וספורט': 'בילוי, נופש וספורט',
  'דלק,אנרגיה': 'דלק ואנרגיה',
  'חקלאות,ובעלי חיים': 'חקלאות ובעלי חיים',
  'שרות,שמירה,ואבטחה': 'שירות, שמירה ואבטחה',
  'מים,פסולת': 'מים ופסולת',
};
const nice = g => NAMES[g] || g.replace(/,/g, ', ').replace(/כמיה/g, 'כימיה');
const PALETTE = ['#e6194b','#2f9e44','#3b5bdb','#f08c00','#9c36b5','#1098ad','#d6336c','#8d5524','#5c940d','#212f8f','#868e96','#0b7285'];

const tally = k => { const m = new Map(); DATA.forEach(d => m.set(d[k], (m.get(d[k]) || 0) + 1)); return [...m].sort((a, b) => b[1] - a[1]); };
const groups = tally('g'), statuses = tally('s');
const color = {}; groups.forEach(([g], i) => color[g] = PALETTE[i % PALETTE.length]);
const on = { g: new Set(groups.map(x => x[0])), s: new Set(statuses.map(x => x[0])) };

// Legend = category filter
const gEl = document.getElementById('groups');
groups.forEach(([g, n]) => {
  const el = document.createElement('label');
  el.className = 'item';
  el.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${color[g]}"></span><span class="lbl"></span><span class="n">${n}</span>`;
  el.querySelector('.lbl').textContent = nice(g);
  const cb = el.querySelector('input');
  cb.addEventListener('change', () => { cb.checked ? on.g.add(g) : on.g.delete(g); render(); });
  el.sync = () => { cb.checked = on.g.has(g); el.classList.toggle('off', !cb.checked); };
  gEl.appendChild(el);
});
const sEl = document.getElementById('statuses');
statuses.forEach(([s, n]) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = s; b.title = `${n} עסקים`;
  b.addEventListener('click', () => { on.s.has(s) ? on.s.delete(s) : on.s.add(s); render(); });
  b.sync = () => b.classList.toggle('off', !on.s.has(s));
  sEl.appendChild(b);
});

document.getElementById('showAll').onclick = () => {
  groups.forEach(([g]) => on.g.add(g)); statuses.forEach(([s]) => on.s.add(s));
  q.value = ''; render();
};
document.getElementById('clearAll').onclick = () => { on.g.clear(); q.value = ''; render(); };

// Map
const map = L.map('map', { zoomControl: true, attributionControl: true });
const bases = {
  map: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }),
  sat: L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: .7 }),
  ]),
};
let base = bases.map.addTo(map);
document.querySelectorAll('[data-base]').forEach(b => b.onclick = () => {
  map.removeLayer(base); base = bases[b.dataset.base].addTo(map); base.bringToBack?.();
  document.querySelectorAll('[data-base]').forEach(x => x.classList.toggle('on', x === b));
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const layer = L.featureGroup().addTo(map);
DATA.forEach(d => {
  d.mk = L.circleMarker([d.lat, d.lon], { radius: 6.5, weight: 1.5, color: '#fff', fillColor: color[d.g], fillOpacity: .92 })
    .bindTooltip(esc(d.n), { direction: 'top', offset: [0, -6] })
    .bindPopup(`<div class="pp-name">${esc(d.n)}</div><div class="pp-what">${esc(d.m)}</div>
      <div class="pp-row"><span>כתובת:</span> ${esc(d.a)}</div>
      ${d.p ? `<div class="pp-row"><span>טלפון:</span> ${esc(d.p)}</div>` : ''}
      <div class="pp-row"><span>רישיון:</span> ${esc(d.s)}${d.e && !d.e.endsWith('2099') ? ` · עד ${esc(d.e)}` : ''}</div>
      <span class="pp-tag" style="background:${color[d.g]}">${esc(nice(d.g))}</span>`);
  d.t = (d.n + ' ' + d.a + ' ' + d.m).toLowerCase();
});
map.on('zoomend', () => { const r = map.getZoom() >= 17 ? 9 : map.getZoom() >= 15 ? 7 : 5.5; DATA.forEach(d => d.mk.setRadius(r)); });

const q = document.getElementById('q');
q.addEventListener('input', render);
document.getElementById('total').textContent = DATA.length;

function render() {
  const term = q.value.trim().toLowerCase();
  let n = 0; layer.clearLayers();
  DATA.forEach(d => { if (on.g.has(d.g) && on.s.has(d.s) && (!term || d.t.includes(term))) { layer.addLayer(d.mk); n++; } });
  document.getElementById('shown').textContent = n;
  gEl.querySelectorAll('.item').forEach(el => el.sync());
  sEl.querySelectorAll('.chip').forEach(el => el.sync());
}

// Panel toggle + fit view leaving room for the panel
const panel = document.getElementById('panel'), tgl = document.getElementById('togglePanel');
const fit = () => {
  const wide = innerWidth > 560, hidden = panel.classList.contains('hidden');

  setView('map');
  if (!layer.hasLayer(d.mk)) { on.g.add(d.g); on.s.add(d.s); q.value = ''; render(); }
  touched = true; map.setView([d.lat, d.lon], 18); d.mk.openPopup();
});
function setView(v) {
  document.body.classList.toggle('table', v === 'table');
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'map') setTimeout(() => map.invalidateSize(), 0);
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
drawTable();
</script>
</body>
