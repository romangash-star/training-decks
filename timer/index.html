<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טיימר</title>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Alef", Arial, sans-serif; background: #faf5ec; color: #2a211b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; padding: 3vh 4vw; }
  h1 { font-size: clamp(24px, 4vh, 44px); color: #1f5f5b; text-align: center; }
  .faces { display: flex; gap: 2.5vw; width: 100%; max-width: 1500px; justify-content: center; }
  .face { flex: 1; max-width: 1100px; background: #1f5f5b; color: #fffdf8; border-radius: 32px; padding: 3vh 2vw; text-align: center; box-shadow: 0 18px 44px rgba(42, 33, 27, .14); transition: background .4s, opacity .4s; }
  .face .lab { font-size: clamp(20px, 3.4vh, 40px); font-weight: 700; opacity: .9; }
  .face .clock { font-size: clamp(90px, 30vh, 330px); font-weight: 700; line-height: 1.05; direction: ltr; font-variant-numeric: tabular-nums; }
  .face { min-width: 0; }
  .two .clock { font-size: clamp(70px, 15vw, 240px); }
  .face.wait { background: #ffffff; color: #2a211b; border: 2px solid #e6ddd0; box-shadow: none; }
  .face.paused { background: #5d7774; }
  .face.done { background: #b4502f; color: #fff; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button, input { font-family: inherit; font-weight: 700; font-size: clamp(20px, 3.2vh, 34px); border-radius: 16px; padding: 12px 26px; cursor: pointer; }
  button { background: #fff; color: #1f5f5b; border: 2px solid #a9cfc6; }
  button:hover { background: #dcedea; }
  button.main { background: #1f5f5b; color: #fffdf8; border-color: #1f5f5b; min-width: 220px; }
  button.main.stop { background: #b4502f; border-color: #b4502f; }
  button.on { background: #1f5f5b; color: #fff; border-color: #1f5f5b; }
  input { width: 130px; text-align: center; border: 2px solid #a9cfc6; background: #fff; color: #2a211b; cursor: text; }
  .hint { font-size: clamp(16px, 2.2vh, 24px); color: #5c5047; text-align: center; }
  label { font-size: clamp(18px, 2.8vh, 30px); font-weight: 700; color: #5c5047; }
</style>
</head>
<body>
  <h1 id="ttl">טיימר</h1>
  <div class="faces">
    <div class="face" id="fa"><div class="lab" id="la">זמן עבודה</div><div class="clock" id="ca">00:00</div></div>
    <div class="face wait" id="fb" hidden><div class="lab">שאלות ומשוב</div><div class="clock" id="cb">02:00</div></div>
  </div>
  <div class="row">
    <button class="main" id="go">התחל</button>
    <button id="reset">אפס</button>
  </div>
  <div class="row" id="chips"></div>
  <div class="row"><label for="cm">זמן אחר, בדקות:</label><input id="cm" type="number" min="1" max="180" inputmode="numeric"><button id="set">קבע</button></div>
  <p class="hint">רווח: התחל או עצור · R: אפס · אפשר לסגור את הלשונית ולחזור למצגת בכל רגע</p>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var num = function (v, d, lo, hi) { v = parseInt(v, 10); return isFinite(v) && v >= lo && v <= hi ? v : d; };
  var M = num(q.get('m'), 15, 1, 180), Q = num(q.get('q'), 0, 0, 60);
  var PRE = Q ? [3, 5, 7, 10] : [5, 10, 15, 20, 25, 45, 70];
  var $ = function (id) { return document.getElementById(id); };
  var fa = $('fa'), fb = $('fb'), ca = $('ca'), cb = $('cb'), la = $('la'), go = $('go');
  var left, phase, run = null, endAt = 0;
  function f(s) { s = Math.max(0, Math.ceil(s)); var m = Math.floor(s / 60), c = s % 60; return (m < 10 ? '0' : '') + m + ':' + (c < 10 ? '0' : '') + c; }
  function chips() {
    var box = $('chips'); box.innerHTML = '';
    PRE.forEach(function (m) { var b = document.createElement('button'); b.textContent = m + ' דק׳'; if (m === M) b.className = 'on'; b.onclick = function () { setM(m); }; box.appendChild(b); });
  }
  function show() {
    la.textContent = Q ? 'הצגה · ' + M + ' דקות' : M + ' דקות';
    $('ttl').textContent = Q ? 'הצגה, ואז שאלות ומשוב' : 'טיימר';
    document.title = (run ? '▶ ' : '') + f(left) + ' · טיימר';
    fb.hidden = !Q;
    fa.parentNode.className = Q ? 'faces two' : 'faces';
    if (phase === 0) { ca.textContent = f(left); cb.textContent = f(Q * 60); fa.className = 'face' + (run ? '' : ' paused'); fb.className = 'face wait'; }
    else if (phase === 1) { ca.textContent = '00:00'; cb.textContent = f(left); fa.className = 'face wait'; fb.className = 'face' + (run ? '' : ' paused'); }
    else { ca.textContent = '00:00'; cb.textContent = '00:00'; (Q ? fb : fa).className = 'face done'; if (Q) fa.className = 'face wait'; }
    go.textContent = phase === 2 ? 'הסתיים' : run ? 'עצור' : (left < (phase === 0 ? M : Q) * 60 ? 'המשך' : 'התחל');
    go.className = 'main' + (run ? ' stop' : '');
  }
  function beep() { try { var A = new (window.AudioContext || window.webkitAudioContext)(), o = A.createOscillator(), g = A.createGain(); o.connect(g); g.connect(A.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(A.currentTime + .5); } catch (e) {} }
  function tick() {
    left = (endAt - Date.now()) / 1000;
    if (left <= 0) {
      beep();
      if (phase === 0 && Q) { phase = 1; left = Q * 60; endAt = Date.now() + left * 1000; }
      else { phase = 2; left = 0; clearInterval(run); run = null; }
    }
    show();
  }
  function start() { if (run || phase === 2) return; endAt = Date.now() + left * 1000; run = setInterval(tick, 250); show(); }
  function stop() { if (!run) return; clearInterval(run); run = null; left = Math.max(0, (endAt - Date.now()) / 1000); show(); }
  function reset() { if (run) { clearInterval(run); run = null; } phase = 0; left = M * 60; show(); }
  function setM(m) { M = m; chips(); reset(); }
  go.onclick = function () { run ? stop() : start(); };
  $('reset').onclick = reset;
  $('set').onclick = function () { var v = num($('cm').value, 0, 1, 180); if (v) setM(v); };
  $('cm').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('set').click(); e.stopPropagation(); });
  document.addEventListener('keydown', function (e) { if (e.code === 'Space') { e.preventDefault(); go.click(); } else if (e.key === 'r' || e.key === 'R' || e.key === 'ר') reset(); });
  chips(); reset(); start();
})();
</script>
</body>
</html>
